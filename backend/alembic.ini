# Alembic configuration (design doc 6.5).
# DATABASE_URL environment variable wins; otherwise sqlalchemy.url below is used.
# SQLite defaults to backend/dajidali.sqlite3 (ignored by .gitignore).
# NOTE: this file must stay ASCII-only because Alembic reads it with the
# platform locale encoding (GBK on this Windows host).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
sqlalchemy.url = sqlite:///./dajidali.sqlite3
# SQLite cannot ALTER much; migrations use batch mode (see migrations/env.py).
render_as_batch = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
