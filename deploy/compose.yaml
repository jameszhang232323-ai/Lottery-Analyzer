# 大吉大利服务器部署（设计文档 12.3）。
# 使用前：cp deploy/env.example deploy/.env && 修改，然后：
#   docker compose -f deploy/compose.yaml --env-file deploy/.env build
#   docker compose -f deploy/compose.yaml --env-file deploy/.env run --rm api python -m dajidali init-db
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d
# 只有 proxy 映射宿主机端口；数据库与 API 只在内部网络可达。

name: dajidali

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  image: dajidali-app:${DAJIDALI_VERSION:-local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: runtime
  env_file:
    - .env
  restart: unless-stopped
  init: true
  logging: *default-logging

services:
  proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: proxy
    image: dajidali-proxy:${DAJIDALI_VERSION:-local}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${DAJIDALI_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *app
    command: ["python", "-m", "dajidali", "serve-api", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - dajidali_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *app
    command: ["python", "-m", "dajidali", "serve-worker", "--poll-interval", "2"]
    volumes:
      - dajidali_data:/data
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["python", "-m", "dajidali", "serve-scheduler", "--interval", "30"]
    volumes:
      - dajidali_data:/data
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dajidali}
      POSTGRES_USER: ${POSTGRES_USER:-dajidali}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 设置 POSTGRES_PASSWORD}
    volumes:
      - dajidali_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  dajidali_pgdata:
  dajidali_data:
