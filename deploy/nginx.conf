# 大吉大利同源入口（设计文档 12.3）。
# 容器内监听 8080（nginx-unprivileged 非 root），宿主机只暴露 proxy 一个端口。
# 本文件只处理 HTTP；HTTPS 由外层 TLS 终止或另行挂载证书，见 deployment.md。

upstream dajidali_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 上传/导入包上限；后端还会再次校验内容和大小。
    client_max_body_size 25m;
    client_body_timeout 30s;
    send_timeout 120s;

    # 常见安全头；CSP 允许 ECharts 的 canvas 与 Vue 的内联样式。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://dajidali_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 认证 Cookie 已由后端设置 HttpOnly/SameSite；代理不改写响应。
    }

    # 带哈希的构建资源可长期缓存；用 expires 而非 add_header，
    # 避免 nginx 在 location 内覆盖掉 server 级安全头。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    # Vue Router history 模式：未命中的前端路径回退到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
